<header>
<div class="mb-5">
</div>
</header>
<div id="main-content">
<div class="min-vh-50">
<div class="block">
<article class="node blog blog--post">
<div class="image-wrapper">
<div class="field field--name-field-image field--type-image">
{{img}}
</div>
</div>
<div class="container">
<div class="content-links">
<div class="content-links__categories">{{categories}}</div>
<div class="content-links__share">
<div class="d-flex share-links gap-2 fs-5">
<a href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{abs_url}}&amp;title={{title_enc}}" target="_blank">
<i class="fa-fw fa-brands fa-linkedin"></i>
</a>
<a href="https://www.instagram.com/" target="_blank">
<i class="fa-fw fa-brands fa-instagram"></i>
</a>
<a href="https://twitter.com/intent/tweet?url={{abs_url}}&amp;text={{title_enc}}" target="_blank">
<i class="fa-fw fa-brands fa-x-twitter"></i>
</a>
</div>
</div>
</div>
<h1>
<span>{{title_attr}}</span>
</h1>
<div class="content-wrapper">
<div class="node__content">{{body}}</div>
</div>
</div>
</article>
</div>
<!--related-start--><div class="block container">
<h2>
                  Related Articles
            </h2>
<div>
<div class="view blog-embed">
<div class="view-content">{{related}}</div>
</div>
</div>
</div><!--related-end-->
</div>
</div>
